<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RTL block diagram for a 4-bit arithmetic/logic library</title>
  <desc id="desc">Four-bit operands A and B and a two-bit operation select feed the arithmetic logic library, which produces a four-bit result and a carry out for addition.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#355070"/>
    </marker>
    <style>
      .bg{fill:#f5f8fc}.title{font:700 30px Arial,sans-serif;fill:#17365d}.label{font:700 20px Arial,sans-serif;fill:#17365d}.small{font:16px Arial,sans-serif;fill:#43536a}.box{fill:#fff;stroke:#7890a8;stroke-width:2.5}.core{fill:#e4effa;stroke:#235789;stroke-width:3}.wire{fill:none;stroke:#355070;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="20"/>
  <text class="title" x="600" y="52" text-anchor="middle">4-bit Arithmetic / Logic Library</text>

  <rect class="box" x="55" y="115" width="250" height="78" rx="12"/>
  <text class="label" x="180" y="148" text-anchor="middle">Operand A</text>
  <text class="small" x="180" y="176" text-anchor="middle">a[3:0]</text>

  <rect class="box" x="55" y="235" width="250" height="78" rx="12"/>
  <text class="label" x="180" y="268" text-anchor="middle">Operand B</text>
  <text class="small" x="180" y="296" text-anchor="middle">b[3:0]</text>

  <rect class="box" x="55" y="355" width="250" height="78" rx="12"/>
  <text class="label" x="180" y="388" text-anchor="middle">Operation select</text>
  <text class="small" x="180" y="416" text-anchor="middle">operation[1:0]</text>

  <rect class="core" x="450" y="180" width="330" height="190" rx="18"/>
  <text class="label" x="615" y="245" text-anchor="middle">Arithmetic Logic</text>
  <text class="label" x="615" y="275" text-anchor="middle">Library</text>
  <text class="small" x="615" y="320" text-anchor="middle">AND · OR · XOR · ADD</text>

  <path class="wire" d="M305 154H395V225H450"/>
  <path class="wire" d="M305 274H450"/>
  <path class="wire" d="M305 394H395V325H450"/>

  <rect class="box" x="895" y="205" width="250" height="78" rx="12"/>
  <text class="label" x="1020" y="238" text-anchor="middle">Result</text>
  <text class="small" x="1020" y="266" text-anchor="middle">result[3:0]</text>
  <path class="wire" d="M780 244H895"/>

  <rect class="box" x="895" y="325" width="250" height="78" rx="12"/>
  <text class="label" x="1020" y="358" text-anchor="middle">Carry out</text>
  <text class="small" x="1020" y="386" text-anchor="middle">carry_out (addition)</text>
  <path class="wire" d="M780 310H840V364H895"/>

  <text class="small" x="600" y="492" text-anchor="middle">00 = AND     01 = OR     10 = XOR     11 = unsigned addition</text>
</svg>

